<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming in His Garden</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background-image: url('FADA176D-B481-43C3-89D9-FAFDA7EFF5B1.png');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: contain;
  background-color: #120806;
  font-family: Georgia, serif;
}

/* Right-side Bible page tabs */
.page-tabs {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 20;
}

/* Each tab */
.page-tab {
  text-decoration: none;
  color: #5c3218;
  font-weight: bold;
  font-size: 15px;
  padding: 13px 16px 13px 20px;
  min-width: 165px;
  border-radius: 22px 0 0 22px;
  border: 2px solid #d7a766;
  border-right: none;
  background: linear-gradient(135deg, #fffaf0 0%, #f7d6b8 48%, #e9b36f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.75),
    -4px 5px 14px rgba(44, 20, 8, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Little flower on each tab */
.page-tab::before {
  content: "✿ ";
  color: #b97847;
}

/* Special tab colors */
.bible-tab {
  background: linear-gradient(135deg, #fff8ed 0%, #f6d6b8 42%, #eab36d 100%);
}

.journal-tab {
  background: linear-gradient(135deg, #fff7f2 0%, #f7cfc0 42%, #dda06f 100%);
}

.study-tab {
  background: linear-gradient(135deg, #fffaf0 0%, #ead2a3 42%, #c99a51 100%);
}

.library-tab {
  background: linear-gradient(135deg, #fffaf0 0%, #e8d8b8 42%, #b98b50 100%);
}

.garden-tab {
  background: linear-gradient(135deg, #fffaf0 0%, #dfe7bd 42%, #a9b66b 100%);
}

/* Hover movement */
.page-tab:hover {
  transform: translateX(-8px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    -7px 8px 18px rgba(44, 20, 8, 0.45);
}

/* Smaller screens */
@media (max-width: 760px) {
  .page-tabs {
    right: 0;
    top: auto;
    bottom: 14px;
    transform: none;
    left: 0;
    align-items: center;
    gap: 8px;
  }

  .page-tab {
    min-width: 190px;
    text-align: center;
    border-radius: 999px;
    border-right: 2px solid #d7a766;
    padding: 11px 16px;
    font-size: 14px;
  }

  .page-tab:hover {
    transform: translateY(-2px);
  }
}
</style>
</head>

<body>

<nav class="page-tabs">
  <a class="page-tab bible-tab" href="bible-reader.html">📖 Bible Reader</a>
  <a class="page-tab journal-tab" href="bible-journal.html">📔 Bible Journal</a>
  <a class="page-tab study-tab" href="study-binder.html">📒 Study Binder</a>
  <a class="page-tab library-tab" href="grand-library.html">📚 Grand Library</a>
  <a class="page-tab garden-tab" href="garden.html">🌿 Gardens</a>
</nav>

</body>
</html>
