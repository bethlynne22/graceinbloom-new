<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming in His Garden</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #120806;
  font-family: Georgia, serif;
}

/* Keeps the artwork whole without cropping */
.scene {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #120806;
}

.scene-frame {
  position: relative;
  width: min(100vw, calc(100vh * 2.14));
  aspect-ratio: 2.14 / 1;
  background-image: url('FADA176D-B481-43C3-89D9-FAFDA7EFF5B1.png');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

/* Invisible clickable areas */
.hotspot {
  position: absolute;
  display: block;
  text-decoration: none;
  background: transparent;
  color: transparent;
  font-size: 0;
  z-index: 50;
  cursor: pointer;
}

/* Open Bible in the family picture */
.bible-open {
  left: 41.5%;
  top: 78%;
  width: 12%;
  height: 11%;
}

/* Tree / garden area */
.garden-area {
  left: 43%;
  top: 8%;
  width: 22%;
  height: 48%;
}

/* Right-side actual artwork tabs */
.prayer-tab {
  left: 87%;
  top: 1.5%;
  width: 12.5%;
  height: 8%;
}

.journal-tab {
  left: 87%;
  top: 11.7%;
  width: 12.5%;
  height: 8%;
}

/* Keep these visible to screen readers only if needed later, but NOT linked now */
</style>
</head>

<body>

<div class="scene">
  <div class="scene-frame">

    <!-- Working links only -->
    <a class="hotspot bible-open" href="bible-reader.html" aria-label="Bible Reader">Bible Reader</a>
    <a class="hotspot garden-area" href="garden.html" aria-label="Gardens">Gardens</a>
    <a class="hotspot prayer-tab" href="study-binder.html" aria-label="Study Binder">Study Binder</a>
    <a class="hotspot journal-tab" href="bible-journal.html" aria-label="Bible Journal">Bible Journal</a>

  </div>
</div>

</body>
</html>
