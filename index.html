body {

.nav-wrap {

.nav-button::before {
  content: "✿";
  font-size: 13px;
  color: #b97847;
  opacity: 0.85;
}

.bible-button {
  background: linear-gradient(135deg, #fff8ed 0%, #f7d6b8 35%, #eab36d 100%);
  border-color: #e0b15d;
  color: #5c3218;
}

.nav-button:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    0 8px 16px rgba(44, 20, 8, 0.45);
}

@media (max-width: 600px) {
  .nav {
    gap: 10px;
    padding: 10px;
  }

  .nav-button {
    font-size: 14px;
    padding: 11px 16px;
