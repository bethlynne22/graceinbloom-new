<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming in His Garden Bible</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #4b2d18;
  background:
    radial-gradient(circle at top left, rgba(255, 226, 196, 0.55), transparent 35%),
    radial-gradient(circle at bottom right, rgba(245, 190, 135, 0.45), transparent 35%),
    linear-gradient(135deg, #fff8ea, #f6dfbf, #d9a85f);
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  padding: 28px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.home-button {
  position: fixed;
  top: 16px;
  left: 16px;
  text-decoration: none;
  background: linear-gradient(135deg, #eac06b, #a66a2c);
  color: #fffaf0;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: bold;
  box-shadow: 0 5px 14px rgba(55, 28, 8, 0.35);
  border: 1px solid rgba(255, 235, 180, 0.7);
}

.bible-card {
  width: min(920px, 96vw);
  background: rgba(255, 250, 238, 0.92);
  border: 3px solid #c99a51;
  border-radius: 32px;
  padding: 34px 26px;
  box-shadow: 0 16px 36px rgba(85, 45, 12, 0.28);
  position: relative;
  overflow: hidden;
}

.bible-card::before {
  content: "✿  ✿  ✿";
  position: absolute;
  top: 18px;
  right: 28px;
  color: rgba(168, 102, 45, 0.35);
  font-size: 26px;
  letter-spacing: 10px;
}

.bible-card::after {
  content: "❀";
  position: absolute;
  bottom: 18px;
  left: 28px;
  color: rgba(191, 125, 72, 0.35);
  font-size: 46px;
}

h1 {
  text-align: center;
  margin: 10px 0 8px;
  color: #9b5f28;
  font-size: clamp(32px, 5vw, 52px);
}

.subtitle {
  text-align: center;
  max-width: 650px;
  margin: 0 auto 30px;
  font-size: 18px;
  line-height: 1.6;
  color: #6d4324;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 16px;
  max-width: 680px;
  margin: 0 auto 24px;
}

label {
  font-weight: bold;
  color: #74461f;
  display: block;
  margin-bottom: 7px;
}

select {
  width: 100%;
  padding: 13px 14px;
  border-radius: 14px;
  border: 2px solid #c89245;
  background: #fffaf0;
  color: #4b2d18;
  font-size: 17px;
  font-family: Georgia, serif;
}

.button-row {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 24px;
}

.pretty-button {
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 999px;
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: bold;
  color: #5c3218;
  background: linear-gradient(135deg, #fff8ed, #f7d6b8, #eab36d);
  border: 2px solid #d4a052;
  box-shadow: 0 6px 14px rgba(75, 38, 12, 0.28);
}

.pretty-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 18px rgba(75, 38, 12, 0.36);
}

.secondary {
  background: linear-gradient(135deg, #fffaf0, #efd9b8, #d7a866);
}

.journal {
  background: linear-gradient(135deg, #fff7f2, #f7cfc0, #dda06f);
}

.saved-note {
  text-align: center;
  margin-top: 22px;
  color: #74461f;
  font-size: 16px;
  min-height: 22px;
}

.small-note {
  text-align: center;
  margin-top: 28px;
  font-size: 14px;
  color: #7b573a;
}

@media (max-width: 650px) {
  .controls {
    grid-template-columns: 1fr;
  }

  .home-button {
    position: static;
    display: inline-block;
    margin-bottom: 18px;
  }

  .page {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<a class="home-button" href="index.html">🏡 Return Home</a>

<main class="page">
  <section class="bible-card">
    <h1>Blooming in His Garden Bible</h1>

    <p class="subtitle">
      Choose a book and chapter, then open the real KJV Bible reading online.
      You can also open your Bible Journal for the same chapter.
    </p>

    <div class="controls">
      <div>
        <label for="bookSelect">Book</label>
        <select id="bookSelect"></select>
      </div>

      <div>
        <label for="chapterSelect">Chapter</label>
        <select id="chapterSelect"></select>
      </div>
    </div>

    <div class="button-row">
      <button class="pretty-button" onclick="openKJV()">📖 Open KJV Chapter</button>
      <button class="pretty-button journal" onclick="openJournal()">📔 Open Journal</button>
      <button class="pretty-button secondary" onclick="saveSpot()">🔖 Save My Spot</button>
      <button class="pretty-button secondary" onclick="openSavedSpot()">🌸 Open Saved Spot</button>
    </div>

    <div class="saved-note" id="savedNote"></div>

    <p class="small-note">
      Your floral Bible pages, study binder, coloring pages, and wildflower designs can be added book by book over time.
    </p>
  </section>
</main>

<script>
const books = [
  ["Genesis", 50], ["Exodus", 40], ["Leviticus", 27], ["Numbers", 36], ["Deuteronomy", 34],
  ["Joshua", 24], ["Judges", 21], ["Ruth", 4], ["1 Samuel", 31], ["2 Samuel", 24],
  ["1 Kings", 22], ["2 Kings", 25], ["1 Chronicles", 29], ["2 Chronicles", 36],
  ["Ezra", 10], ["Nehemiah", 13], ["Esther", 10], ["Job", 42], ["Psalms", 150],
  ["Proverbs", 31], ["Ecclesiastes", 12], ["Song of Solomon", 8], ["Isaiah", 66],
  ["Jeremiah", 52], ["Lamentations", 5], ["Ezekiel", 48], ["Daniel", 12], ["Hosea", 14],
  ["Joel", 3], ["Amos", 9], ["Obadiah", 1], ["Jonah", 4], ["Micah", 7], ["Nahum", 3],
  ["Habakkuk", 3], ["Zephaniah", 3], ["Haggai", 2], ["Zechariah", 14], ["Malachi", 4],
  ["Matthew", 28], ["Mark", 16], ["Luke", 24], ["John", 21], ["Acts", 28], ["Romans", 16],
  ["1 Corinthians", 16], ["2 Corinthians", 13], ["Galatians", 6], ["Ephesians", 6],
  ["Philippians", 4], ["Colossians", 4], ["1 Thessalonians", 5], ["2 Thessalonians", 3],
  ["1 Timothy", 6], ["2 Timothy", 4], ["Titus", 3], ["Philemon", 1], ["Hebrews", 13],
  ["James", 5], ["1 Peter", 5], ["2 Peter", 3], ["1 John", 5], ["2 John", 1],
  ["3 John", 1], ["Jude", 1], ["Revelation", 22]
];

const bookSelect = document.getElementById("bookSelect");
const chapterSelect = document.getElementById("chapterSelect");
const savedNote = document.getElementById("savedNote");

books.forEach(([book]) => {
  const option = document.createElement("option");
  option.value = book;
  option.textContent = book;
  bookSelect.appendChild(option);
});

function updateChapters() {
  const selectedBook = bookSelect.value;
  const bookInfo = books.find(([book]) => book === selectedBook);
  const chapterCount = bookInfo ? bookInfo[1] : 1;

  chapterSelect.innerHTML = "";

  for (let i = 1; i <= chapterCount; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i;
    chapterSelect.appendChild(option);
  }
}

function getKJVUrl(book, chapter) {
  const passage = encodeURIComponent(book + " " + chapter);
  return "https://www.biblegateway.com/passage/?search=" + passage + "&version=KJV";
}

function openKJV() {
  const book = bookSelect.value;
  const chapter = chapterSelect.value;
  window.open(getKJVUrl(book, chapter), "_blank", "noopener");
}

function openJournal() {
  const book = encodeURIComponent(bookSelect.value);
  const chapter = encodeURIComponent(chapterSelect.value);
  window.location.href = "bible-journal.html?book=" + book + "&chapter=" + chapter;
}

function saveSpot() {
  const book = bookSelect.value;
  const chapter = chapterSelect.value;
  localStorage.setItem("bloomingBibleSpot", JSON.stringify({ book, chapter }));
  savedNote.textContent = "Saved: " + book + " " + chapter;
}

function openSavedSpot() {
  const saved = localStorage.getItem("bloomingBibleSpot");

  if (!saved) {
    savedNote.textContent = "No saved spot yet.";
    return;
  }

  const spot = JSON.parse(saved);
  window.open(getKJVUrl(spot.book, spot.chapter), "_blank", "noopener");
}

bookSelect.addEventListener("change", updateChapters);

updateChapters();

const saved = localStorage.getItem("bloomingBibleSpot");
if (saved) {
  const spot = JSON.parse(saved);
  const bookExists = books.some(([book]) => book === spot.book);

  if (bookExists) {
    bookSelect.value = spot.book;
    updateChapters();
    chapterSelect.value = spot.chapter;
    savedNote.textContent = "Saved spot: " + spot.book + " " + spot.chapter;
  }
}
</script>

</body>
</html>
